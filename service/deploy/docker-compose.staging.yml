services:
  platform-db-canary:
    image: postgres:16-alpine
    container_name: mago_platform_db_canary
    restart: "no"
    env_file:
      - ./platform-db-canary.env
    volumes:
      - mago_canary_platform_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - mago_canary_backend

  platform-redis-canary:
    image: redis:7-alpine
    container_name: mago_platform_redis_canary
    restart: "no"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - mago_canary_platform_redisdata:/data
    networks:
      - mago_canary_backend

  licensing-app-canary:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: mago_licensing_app_canary
    restart: "no"
    env_file:
      - ./service.env
    environment:
      LICENSE_PORT: "4349"
      PLATFORM_AUTO_CREATE_SCHEMA: "false"
    depends_on:
      platform-db-canary:
        condition: service_healthy
      platform-redis-canary:
        condition: service_started
    ports:
      - "127.0.0.1:4350:4349"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4349/health/ready >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - mago_canary_backend

  webhook-worker-canary:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: mago_webhook_worker_canary
    restart: "no"
    env_file:
      - ./service.env
    depends_on:
      platform-db-canary:
        condition: service_healthy
    command: ["sh", "-lc", "python3 -m app.wait_for_db && exec python3 -m app.webhook_worker"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/mago_webhook_worker_heartbeat && test $(( $(date +%s) - $(stat -c %Y /tmp/mago_webhook_worker_heartbeat) )) -lt 45"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - mago_canary_backend

  owner-welcome-worker-canary:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: mago_owner_welcome_worker_canary
    restart: "no"
    env_file:
      - ./service.env
    depends_on:
      platform-db-canary:
        condition: service_healthy
    command: ["sh", "-lc", "python3 -m app.wait_for_db && exec python3 -m app.owner_welcome_worker"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/mago_owner_welcome_worker_heartbeat && test $(( $(date +%s) - $(stat -c %Y /tmp/mago_owner_welcome_worker_heartbeat) )) -lt 45"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - mago_canary_backend

  email-worker-canary:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: mago_email_worker_canary
    restart: "no"
    env_file:
      - ./service.env
    depends_on:
      platform-db-canary:
        condition: service_healthy
    command: ["sh", "-lc", "python3 -m app.wait_for_db && exec python3 -m app.email_worker"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/mago_email_worker_heartbeat && test $(( $(date +%s) - $(stat -c %Y /tmp/mago_email_worker_heartbeat) )) -lt 45"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - mago_canary_backend

  evolution-health-worker-canary:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: mago_evolution_health_worker_canary
    restart: "no"
    env_file:
      - ./service.env
    depends_on:
      platform-db-canary:
        condition: service_healthy
    command: ["sh", "-lc", "python3 -m app.wait_for_db && exec python3 -m app.evolution_health_worker"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/mago_evolution_health_worker_heartbeat && test $(( $(date +%s) - $(stat -c %Y /tmp/mago_evolution_health_worker_heartbeat) )) -lt 90"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - mago_canary_backend

volumes:
  mago_canary_platform_pgdata:
  mago_canary_platform_redisdata:

networks:
  mago_canary_backend:
    name: mago_canary_backend
