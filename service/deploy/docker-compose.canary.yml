services:
  licensing-app-canary:
    build:
      context: ./service
      dockerfile: Dockerfile
    container_name: mago_licensing_app_canary
    restart: "no"
    env_file:
      - ./service.env
    environment:
      LICENSE_PORT: "4349"
      PLATFORM_AUTO_CREATE_SCHEMA: "false"
    depends_on:
      platform-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:4350:4349"
    networks:
      - platform_backend
      - evolution_internal
